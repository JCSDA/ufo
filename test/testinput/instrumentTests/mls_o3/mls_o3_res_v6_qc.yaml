time window:
  begin: 2025-10-10T03:00:00Z
  end: 2025-10-10T09:00:00Z
  bound to include: begin

observations:
- obs space:
    name: mls_o3_res_v6_l2
    io pool:
      max pool size: 1
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/mls_o3_v6res_2025101006.nc
    simulated variables:
    - ozoneProfile
  obs operator:
    name: VertInterp
    variable maps:
    - name: ozoneProfile
      alias: volume_mixing_ratio_of_o3
    vertical coordinate: air_pressure
    observation vertical coordinate: pressure
    observation vertical coordinate group: MetaData
    interpolation method: log-linear
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_mls_o3_v6res_2025101006.nc
  obs filters:
  - filter: Bounds Check
    filter variables:
    - name: ozoneProfile
    test variables:
    - name: MetaData/referenceLevel
    minvalue: 8
    maxvalue: 49
    flag all filter variables if any test variable is out of bounds: true
  - filter: Bounds Check
    filter variables:
    - name: ozoneProfile
    test variables:
    - name: MetaData/precision
    minvalue: 0.0
    flag all filter variables if any test variable is out of bounds: true
  - filter: RejectList
    filter variables:
    - name: ozoneProfile
    where:
    - variable:
        name: MetaData/status
      any_bit_set_of: 0
  - filter: RejectList
    filter variables:
    - name: ozoneProfile
    where:
    - variable:
        name: MetaData/convergence
      minvalue: 1.03
  - filter: RejectList
    filter variables:
    - name: ozoneProfile
    where:
    - variable:
        name: MetaData/quality
      maxvalue: 1.0
  passedBenchmark: 357
