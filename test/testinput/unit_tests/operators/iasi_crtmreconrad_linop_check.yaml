time window:
  begin: 2023-11-30T21:00:00Z
  end: 2023-12-01T03:00:00Z
  bound to include: begin  # consistency with test data from "ncdiag"

observations:
- obs operator:
    name: CRTM
    Absorbers: [H2O,O3,CO2]
    obs options:
      Sensor_ID: iasi_metop-b
      EndianType: little_endian
      CoefficientPath: Data/
      ReconstructedRadianceCorrection: true
      CMatrixPath: Data/ufo/testinput_tier_1/resources/auxillary/iasi_cmatrix_and_bias
    linear obs operator:
      Absorbers: [H2O,O3]
      Surfaces: [Water_Temperature,Land_Temperature,Ice_Temperature,Snow_Temperature]
  obs space:
    name: iasi_metop-b
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/iasi_metop-b_pcobs_2023120100.nc4
    observed variables: [brightnessTemperature]
    simulated variables: [brightnessTemperature]
    channels: &all_channels 1-1997

  geovals:
    filename: Data/ufo/testinput_tier_1/iasi_metop-b_pcobs_geovals_2023120100.nc4
  vector ref: refHofx
  tolerance: 1.e-7
  linear obs operator test:
    coef TL: 1.e-3
    tolerance TL: 2.0e-3
    tolerance AD: 1.0e-11

- obs operator:
    name: CRTM
    Absorbers: [H2O,O3,CO2]
    obs options:
      Sensor_ID: iasi_metop-b
      EndianType: little_endian
      CoefficientPath: Data/
      ReconstructedRadianceCorrection: true
      CMatrixPath: Data/ufo/testinput_tier_1/resources/auxillary/iasi_cmatrix_and_bias
    linear obs operator:
      Absorbers: [H2O,O3,CO2]
      Surfaces: [Water_Temperature,Land_Temperature,Ice_Temperature,Snow_Temperature]
      nullify jacobian params:
        - variable: mole_fraction_of_carbon_dioxide_in_air
          channels: 1-5
        - variable: mole_fraction_of_ozone_in_air
          channels: 1421-1701
        - variable: water_vapor_mixing_ratio_wrt_dry_air
          channels: 700-1000, 1750-1800
  obs space:
    name: iasi_metop-b_nullify_jacobian
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/iasi_metop-b_pcobs_2023120100.nc4
    observed variables: [brightnessTemperature]
    simulated variables: [brightnessTemperature]
    channels: *all_channels

  geovals:
    filename: Data/ufo/testinput_tier_1/iasi_metop-b_pcobs_geovals_2023120100.nc4
  vector ref: refHofx
  tolerance: 1.e-7
  linear obs operator test:
    coef TL: 1.e-3
    tolerance TL: 3.0e-3  #relaxed tolerance to account for the nullification of the Jacobian
    tolerance AD: 1.0e-11
