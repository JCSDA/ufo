#
#=== Heigth to presure conversion for vertical profile ===#
#

time window:
  begin: 2015-01-08T20:30:00Z
  end: 2015-01-09T03:30:00Z

observations:
- obs space:
    name: Radiosonde
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/met_office_conversion_height2pressure.nc4
      obsgrouping:
        group variables: ["stationIdentification"]
        sort variable: "dateTime"
        sort order: "descending"
    simulated variables: [airTemperature, relativeHumidity, geopotentialHeight, dewPointTemperature]
  obs filters:
  - filter: Variable Transforms
    Transform: PressureFromHeightForProfile
    Method: UKMO
    observation relative humidity units: percentage
    height coordinate: geopotentialHeight
    pressure coordinate: pressure
    pressure group: MetaData
  compareVariables:
  - test:
      name: DerivedMetaData/pressure
    reference:
      name: TestReference/pressure_reference
    relTol: 1.0e-5

- obs space:
    name: Radiosonde pressure from height default with 1 observation
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/met_office_conversion_height2pressure_1ob.nc4
      obsgrouping:
        group variables: ["stationIdentification"]
        sort variable: "dateTime"
        sort order: "descending"
    simulated variables: [airTemperature, relativeHumidity, geopotentialHeight, dewPointTemperature]
  obs filters:
  - filter: Variable Transforms
    Transform: PressureFromHeightForProfile
    Method: UKMO
    observation relative humidity units: fraction
    height coordinate: geopotentialHeight
    pressure coordinate: pressure
    pressure group: MetaData
  compareVariables:
  - test:
      name: DerivedMetaData/pressure
    reference:
      name: TestReference/pressure_reference
    relTol: 1.0e-5

- obs space:
    name: Missing units of relative humidity
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/met_office_conversion_height2pressure.nc4
      obsgrouping:
        group variables: ["stationIdentification"]
        sort variable: "dateTime"
        sort order: "descending"
    simulated variables: [airTemperature, relativeHumidity, geopotentialHeight, dewPointTemperature]
  obs filters:
  - filter: Variable Transforms
    Transform: PressureFromHeightForProfile
    Method: UKMO
    height coordinate: geopotentialHeight
    pressure coordinate: pressure
    pressure group: MetaData
  expectExceptionWithMessage: "PressureFromHeightForProfile: missing required parameter 'observation relative humidity units'"
