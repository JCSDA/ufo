time window:
  begin: 2020-10-01T03:00:00Z
  end: 2020-10-01T09:00:00Z
  bound to include: begin  # consistency with test data from "ncdiag"

observations:
- obs space:
    name: Satwind
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/satwind_obs_1d_2020100106_noinv.nc4
#   obsdataout:
#     engine:
#       type: H5File
#       obsfile: Data/satwind_obs_1d_2020100106_noinv_bestfitpressure_out1.nc4
    simulated variables: [windEastward, windNorthward]
  geovals:
    filename: Data/ufo/testinput_tier_1/satwind_geoval_20201001T0600Z.nc4
  obs filters:
  - filter: Create Diagnostic Flags
    filter variables:
    - name: windEastward
    - name: windNorthward
    flags:
    - name: BestFitPressurePoorlyConstrained
      initial value: false
  - filter: Variable Assignment
    assignments:
    - name: DerivedValue/pressureBestFit
      type: float
      value: -99999.0
  - filter: Model Best Fit Pressure
    observation pressure:
      name: MetaData/pressure
    model pressure:
      name: GeoVaLs/air_pressure_levels_minus_one
    top pressure: 10000
    pressure band half-width: 10000
    upper vector diff: 4
    lower vector diff: 2
    tolerance vector diff: 1.0e-8
    tolerance pressure: 0.01
    calculate bestfit winds: true
  compareVariables:
    - reference:
        name: TestReference/pressureBestFit
      test:
        name: DerivedValue/pressureBestFit
      absTol: 0.5
  passedBenchmark: 182102
#---------------------------------------------------
- obs space:
    name: Missing obsvalues are ignored
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/satwind_obs_1d_small_2020100106_noinv.nc4
    simulated variables: [windEastward, windNorthward]
  geovals:
    filename: Data/ufo/testinput_tier_1/satwind_geoval_small_20201001T0600Z.nc4
  obs filters:
  - filter: Create Diagnostic Flags
    filter variables:
    - name: windEastward
    - name: windNorthward
    flags:
    - name: BestFitPressurePoorlyConstrained
      initial value: false
  - filter: Model Best Fit Pressure
    observation pressure:
      name: MetaData/pressure
    model pressure:
      name: GeoVaLs/air_pressure_levels_minus_one
    top pressure: 10000
    pressure band half-width: 10000
    upper vector diff: 4
    lower vector diff: 2
    tolerance vector diff: 1.0e-8
    tolerance pressure: 0.01
    calculate bestfit winds: true
  compareVariables:
    - reference:
        name: TestReference/pressureBestFit
      test:
        name: DerivedValue/pressureBestFit
      absTol: 0.5
  passedBenchmark: 18
#---------------------------------------------------
- obs space:
    name: Fail to initialise diagnostic flags
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/satwind_obs_1d_small_2020100106_noinv.nc4
#   obsdataout:
#     engine:
#       type: H5File
#       obsfile: Data/testinput_tier_1/satwind_obs_1d_small_2020100106_noinv_bestfitpressure_out3.nc4
    simulated variables: [windEastward, windNorthward]
  geovals:
    filename: Data/ufo/testinput_tier_1/satwind_geoval_small_20201001T0600Z.nc4
  obs filters:
  - filter: Model Best Fit Pressure
    observation pressure:
      name: MetaData/pressure
    model pressure:
      name: GeoVaLs/air_pressure_levels_minus_one
    top pressure: 10000
    pressure band half-width: 10000
    upper vector diff: 4
    lower vector diff: 2
    tolerance vector diff: 1.0e-8
    tolerance pressure: 0.01
    calculate bestfit winds: false
  expectExceptionWithMessage: DiagnosticFlags/BestFitPressurePoorlyConstrained/windEastward or DiagnosticFlags/BestFitPressurePoorlyConstrained/windNorthward not initialised
