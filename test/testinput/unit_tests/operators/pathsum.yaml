time window:
  begin: 2020-10-23T22:00:00Z
  end: 2020-10-23T23:59:00Z

observations:
- obs operator:
    name: PathSum
    path type: vertical            # use "slant" for slant path
    geoval variable: electron_density
    use km for height: true        # only applicable if using sementLength computation inside code
    scaling factor: 1.0e-07        # used to unit conversion
  obs space:
    name: GNSSVTEC
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_vtec_202010232345_100locs.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_vtec_obs_202010232345_opr_out.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_vtec_202010232345_100locs.nc4
  vector ref: TestReference
  tolerance: 1.0e-03
  norm ref: TestReference
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: vertical            
    geoval variable: electron_density
    weights: [1.0, 2.0]         # optional for vertical integration
    height range: [0, 105]      # height range for vertical integration
    scaling factor: 1.0e-04
  obs space:
    name: PathSum_yamlweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_vtec_202010232345_synthetic.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_vtec_obs_202010232345_opr_out2.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_vtec_202010232345_synthetic.nc4
  vector ref: TestReference
  tolerance: 1.0e-03
  norm ref: TestReference
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: vertical
    geoval variable: electron_density
    weight variable: weights    # weight from geoval
    height range: [0, 105]      # height range for vertical integration
    scaling factor: 1.0e-04
  obs space:
    name: PathSum_readweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_vtec_202010232345_synthetic.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_vtec_obs_202010232345_opr_out3.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_vtec_202010232345_synthetic.nc4
  vector ref: TestReference
  tolerance: 1.0e-03
  norm ref: TestReference
  tolerance: 1.0e-06
