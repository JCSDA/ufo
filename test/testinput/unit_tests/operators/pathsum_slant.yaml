time window:
  begin: 2020-10-23T23:00:00Z
  end: 2020-10-24T01:00:00Z
  bound to include: begin  # consistency with test data from "ncdiag"

observations:
- obs operator:
    name: PathSum
    path type: slant
    geoval variable: electron_density
    weight variable: path_weight    # weight from geoval
    scaling factor: 1.0e-16        # used to unit conversion for output
  obs space:
    name: GNSSVTEC_readweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_madirgal_slant-tec_202010232345_100locs.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_slant-tec_obs_202010232345_opr_out1.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_madirgal_slant-tec_202010232345_100locs.nc4
  vector ref: TestReference
  tolerance: 1.0e-06
  norm ref: TestReference
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: slant
    geoval variable: electron_density
    path point latitude variable: path_latitude    # geodetic latitude along the path
    path point longitude variable: path_longitude  # geodetic longitude along the path
    path point height variable: height_above_reference_ellipsoid # geodetic height along the path
    scaling factor: 1.0e-16
  obs space:
    name: GNSSVTEC_computeweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_madirgal_slant-tec_202010232345_100locs.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_slant-tec_obs_202010232345_opr_out2.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_madirgal_slant-tec_202010232345_100locs.nc4
  vector ref: TestReference1
  tolerance: 1.0e-06
  norm ref: TestReference1
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: slant
    geoval variable: electron_density
    weights: [1000.0, 2000.0, 3000.0]
    path point height variable: height_above_reference_ellipsoid # geodetic height along the path
    height range: [0., 105000.]
    scaling factor: 1.0e-16
  obs space:
    name: PathSum_yamlweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_slant-tec_202010232345_synthetic.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_slant-tec_obs_202010232345_opr_out3.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_slant-tec_202010232345_synthetic.nc4
  vector ref: TestReference
  tolerance: 1.0e-06
  norm ref: TestReference
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: slant
    geoval variable: electron_density
    weight variable: weights
    path point height variable: height_above_reference_ellipsoid
    height range: [0.0, 105000.0]
    scaling factor: 1.0e-16
  obs space:
    name: PathSum_readweight
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_slant-tec_202010232345_synthetic.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_slant-tec_obs_202010232345_opr_out4.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_slant-tec_202010232345_synthetic.nc4
  vector ref: TestReference1
  tolerance: 1.0e-06
  norm ref: TestReference1
  tolerance: 1.0e-06
- obs operator:
    name: PathSum
    path type: slant
    geoval variable: electron_density
    weight variable: weights    # weight from geoval
    scaling factor: 1.0e-16
  obs space:
    name: PathSum_basic
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/gnss_gridded_slant-tec_202010232345_synthetic.nc4
    simulated variables: [totalElectronContent]
   #obsdataout:
   #  engine:
   #    type: H5File
   #    obsfile: Data/gnss_slant-tec_obs_202010232345_opr_out5.nc4
  geovals:
    filename: Data/ufo/testinput_tier_1/geovals_gridded_slant-tec_202010232345_synthetic.nc4
  vector ref: TestReference2
  tolerance: 1.0e-06
  norm ref: TestReference2
  tolerance: 1.0e-06
