time window:
  begin: 2020-03-31T21:00:00Z
  end: 2020-04-01T03:00:00Z
  bound to include: begin

# The first two profiles have satelliteIdentifier 224 and the third has -999.
# Only sensor 225 is configured, so these profiles have no simulated channels.
# Process one profile per batch to exercise an empty batch before sensor_index
# has been assigned, followed by valid batches with nonzero TL/AD increments.
# Grouping by satellite gives records 0 (224), 1 (-999), and 2 (225).
# With two RoundRobin ranks, rank 0 has unsupported and valid profiles,
# while rank 1 has one profile but no channels to simulate.
observations:
- obs operator: &ObsOperator
    name: RTTOV
    Absorbers: [CLW]
    linear obs operator:
      increment variables: [air_temperature, water_vapor_mixing_ratio_wrt_moist_air]
    obs options:
      WMO_ID: [225]
      Sat_ID: [noaa_20]
      Instrument_Name: ATMS
      CoefficientPath: Data/
      RTTOV_GasUnitConv: true
      RTTOV_default_opts: UKMO_PS45
      SatRad_compatibility: true
      UseRHwaterForQC: true
      RTTOV_profile_checkinput: true
      prof_by_prof: true
  obs space: &ObsSpace
    name: ATMS empty channel batches OSDF
    use data frame container: true
    distribution:
      name: RoundRobin
    obsdatain:
      obsgrouping:
        group variables: [satelliteIdentifier]
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/atms_obs_2020040100_rttov_multiplatform.nc4
    simulated variables: [brightnessTemperature]
    channels: 1-22
  geovals: &GeoVaLs
    filename: Data/ufo/testinput_tier_1/geovals_atms_20200401T0000Z_allsurfacetypes.nc4
  rms ref: &RmsRef 235.73421968383155
  tolerance: &Tolerance 1.e-7
  linear obs operator test: &LinearTest
    coef TL: 1.e-4
    tolerance TL: 2.0e-2
    tolerance AD: 1.0e-11

- obs operator: *ObsOperator
  obs space:
    <<: *ObsSpace
    name: ATMS empty channel batches ObsGroup
    use data frame container: false
  geovals: *GeoVaLs
  rms ref: *RmsRef
  tolerance: *Tolerance
  linear obs operator test: *LinearTest
