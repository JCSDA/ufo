time window:
  begin: 2000-01-01T00:00:00Z
  end: 2030-01-01T00:00:00Z

observations:
  - obs space:
      name: Test Find Nearest Neighbors
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/ufo/testinput_tier_1/find_nearest_neighbors_obs.nc4
      simulated variables: [airTemperature]
    obs filters:
      - filter: Find Nearest Neighbors
        query point variable: ObsValue/airTemperatureQuery
        reference point variable: ObsValue/airTemperatureReference
        distance output variables: # need as many as nearest neighbors output variable and number to find
          - name: DerivedMetaData/firstNearestSynopTempDistance
          - name: DerivedMetaData/secondNearestSynopTempDistance
          - name: DerivedMetaData/thirdNearestSynopTempDistance
        output assignment: MetaData/stationIdentification
        output variables: # need as many as distance output variables and number to find
          - name: DerivedMetaData/firstNearestSynopTempStatid
          - name: DerivedMetaData/secondNearestSynopTempStatid
          - name: DerivedMetaData/thirdNearestSynopTempStatid
        algorithm: brute force
        distance method: haversine
        distance units: km
    compareVariables:
      - test:
          name: DerivedMetaData/firstNearestSynopTempStatid
        reference:
          name: TestReference/firstNearestStationID
      - test:
          name: DerivedMetaData/secondNearestSynopTempStatid
        reference:
          name: TestReference/secondNearestStationID
      - test:
          name: DerivedMetaData/thirdNearestSynopTempStatid
        reference:
          name: TestReference/thirdNearestStationID
      # NOTE: Lat/lon conversion to float can introduce relative errors of ~5e-8 which
      # are amplified by the haversine calculation to relative distance errors of ~1e-5
      - test:
          name: DerivedMetaData/firstNearestSynopTempDistance
        reference:
          name: TestReference/firstNearestDistance
        relTol: 1.0e-5
      - test:
          name: DerivedMetaData/secondNearestSynopTempDistance
        reference:
          name: TestReference/secondNearestDistance
        relTol: 1.0e-5
      - test:
          name: DerivedMetaData/thirdNearestSynopTempDistance
        reference:
          name: TestReference/thirdNearestDistance
        relTol: 1.0e-5

