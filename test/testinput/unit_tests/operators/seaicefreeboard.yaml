time window:
  begin: 2018-04-14T21:00:00Z
  end: 2018-04-15T03:00:00Z
  bound to include: begin  # consistency with test data from "ncdiag"

observations:
# Lidar altimeter (total freeboard) ------------------------------------------
- obs space:
    name: SeaIceFreeboard lidar
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/cryosat2-2018-04-15.nc
    simulated variables: [seaIceFreeboard]
    observed variables: [seaIceFreeboard]
  obs operator:
    name: SeaIceFreeboard
    instrument: lidar
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  linear obs operator:
    name: SeaIceFreeboard
    instrument: lidar
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  geovals:
    filename: Data/ufo/testinput_tier_1/cryosat2-2018-04-15_seaicefreeboard_geovals.nc
  rms ref: 0.55238745513930754
  tolerance: 1.0e-8
  linear obs operator test:
    coef TL: 1.0e-4
    tolerance TL: 1.0e-5
    tolerance AD: 1.0e-12

# Ka-band radar altimeter (total freeboard, same as lidar) -------------------
- obs space:
    name: SeaIceFreeboard radar Ka
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/cryosat2-2018-04-15.nc
    simulated variables: [seaIceFreeboard]
    observed variables: [seaIceFreeboard]
  obs operator:
    name: SeaIceFreeboard
    instrument: radar Ka
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  linear obs operator:
    name: SeaIceFreeboard
    instrument: radar Ka
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  geovals:
    filename: Data/ufo/testinput_tier_1/cryosat2-2018-04-15_seaicefreeboard_geovals.nc
  rms ref: 0.55238745513930754
  tolerance: 1.0e-8
  linear obs operator test:
    coef TL: 1.0e-4
    tolerance TL: 1.0e-5
    tolerance AD: 1.0e-12

# Ku-band radar altimeter (ice-only freeboard) ------------------------------
- obs space:
    name: SeaIceFreeboard radar Ku
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/cryosat2-2018-04-15.nc
    simulated variables: [seaIceFreeboard]
    observed variables: [seaIceFreeboard]
  obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  linear obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  geovals:
    filename: Data/ufo/testinput_tier_1/cryosat2-2018-04-15_seaicefreeboard_geovals.nc
  rms ref: 0.23404007476100894
  tolerance: 1.0e-8
  linear obs operator test:
    coef TL: 1.0e-4
    tolerance TL: 1.0e-5
    tolerance AD: 1.0e-12

# Exception throwing ----------------------------------------------------------
- obs space:
    name: Check wrong simulated variable throws exception
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/cryosat2-2018-04-15.nc
    simulated variables: [iceThickness]
    observed variables: [iceThickness]
  obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  linear obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  geovals:
    filename: Data/ufo/testinput_tier_1/cryosat2-2018-04-15_seaicefreeboard_geovals.nc
  expect constructor to throw exception with message: can only simulate the variable "seaIceFreeboard"

- obs space:
    name: Check multi-category geovals throw exception
    obsdatain:
      engine:
        type: H5File
        obsfile: Data/ufo/testinput_tier_1/cryosat2-2018-04-15.nc
    simulated variables: [seaIceFreeboard]
    observed variables: [seaIceFreeboard]
  obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  linear obs operator:
    name: SeaIceFreeboard
    instrument: radar Ku
    sea ice density: 917.0
    surface snow density: 330.0
    sea water density: 1026.0
  geovals:
    filename: Data/ufo/testinput_tier_1/cryosat2-2018-04-15_geovals.nc
  expect simulateObs to throw exception with message: SeaIceFreeboard expects single-category
  expect setTrajectory to throw exception with message: SeaIceFreeboard expects single-category
