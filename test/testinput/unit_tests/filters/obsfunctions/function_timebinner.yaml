time window:
  begin: 2000-01-01T00:00:00Z
  end: 2030-01-01T00:00:00Z

observations:
  - obs space:
      name: Test ObsFunction TimeBinner
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/ufo/testinput_tier_1/time_binner_test_obs.nc4
      simulated variables: []
    obs filters:
      # Note: bin centres are floored from the first earliest timestamp
      # globally, so, for 2018-04-17 01:20:02 UTC the first minutely bin is
      # centred on 01:20:00 UTC, the first houly bin is centred on 01:00:00 UTC,
      # the first daily bin on 00:00:00 UTC, etc.
      # If "reverse chronological order: true" then bins are derived from the
      # latest timestamp instead.

      # (A) T-30M <= t <= T where T is the top of the hour. dateTimes outside of
      # this range get missing bin numbers. "binned timestamp variable" should
      # take on the hour value T for all dateTimes in the bin, others get missing.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/aboutHourMinus30MBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: -PT30M # 30 minutes before the hour (inclusive)
                bin window upper bound: PT0M # up to the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/aboutHourMinus30MTimestamps # optional - all values in a bin get the same timestamp - timestamps outside of bin are set to missing
      # (B) As above, but for T-30M <= t <= T+PT29M59S (no missing values
      # expected since OOPS dateTimes are to the nearest second).
      - filter: Variable Assignment
        assignments:
          - name: MetaData/aboutHourMinus30MPlus29M59SBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: -PT30M # 30 minutes before the hour (inclusive)
                bin window upper bound: PT29M59S # up to 29 minutes 59 seconds after the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/aboutHourMinus30MPlus29M59STimestamps
      # (C) T < t <= T+PT1H (i.e. the hour after the top of the hour) - use that
      # OOPS times are to the nearest second to avoid ambiguity at the hour.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/excludingHourPlus1HourBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: PT1S # from the hour (exclusive) or 1S after the hour (inclusive)
                bin window upper bound: PT1H # up to one hour after the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/excludingHourPlus1HourBinTimestamps
      # (D) Test day interval, i.e. T-12H <= t <= T where T is midnight UTC.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/aboutMidnightMinus12HBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: day
                bin window lower bound: -PT12H # 12 hours before midnight (inclusive)
                bin window upper bound: PT0M # up to midnight (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/aboutMidnightMinus12HTimestamps
      # (E) Test minute interval: T-30S <= t <= T+10S where T is the minute.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/aboutMinuteMinus30SPlus10SBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: minute
                bin window lower bound: -PT30S # 30 seconds before the minute (inclusive)
                bin window upper bound: PT10S # up to 10 seconds after the minute (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/aboutMinuteMinus30SPlus10STimestamps
      # (F) Test reverse chronological order: T-30M <= t <= T+PT29M59S where T
      # is the hour, but deriving bins from the latest timestamp back to earliest.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/reverseAboutHourMinus30MPlus29M59SBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: -PT30M # 30 minutes before the hour (inclusive)
                bin window upper bound: PT29M59S # up to 29 minutes 59 seconds after the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/reverseAboutHourMinus30MPlus29M59STimestamps
                reverse chronological order: true # default is false
      # (G) Test reverse chronological order: T-30M <= t <= T where T is the hour.
      # deriving bins from the latest timestamp back to earliest.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/reverseAboutHourMinus30MBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: -PT30M # 30 minutes before the hour (inclusive)
                bin window upper bound: PT0M # up to the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/reverseAboutHourMinus30MTimestamps
                reverse chronological order: true # default is false
      # (H) Test reverse chronological order with opposite offset to (G):
      # T <= t <= T+30M where T is the hour, deriving bins from the latest timestamp
      # back to earliest.
      - filter: Variable Assignment
        assignments:
          - name: MetaData/reverseAboutHourPlus30MBinNumbers
            type: int
            function:
              name: IntObsFunction/TimeBinner
              options:
                bin interval unit: hour
                bin window lower bound: PT0M # from the hour (inclusive)
                bin window upper bound: PT30M # up to 30 minutes after the hour (inclusive)
                input timestamp variable: MetaData/dateTime # default
                binned timestamp variable: MetaData/reverseAboutHourPlus30MTimestamps
                reverse chronological order: true # default is false
    compareVariables:
      # (A)
      - test:
          name: MetaData/aboutHourMinus30MBinNumbers
        reference:
          name: TestReference/aboutHourMinus30MBinNumbers
      - test:
          name: MetaData/aboutHourMinus30MTimestamps
        reference:
          name: TestReference/aboutHourMinus30MTimestamps
      # (B)
      - test:
          name: MetaData/aboutHourMinus30MPlus29M59SBinNumbers
        reference:
          name: TestReference/aboutHourMinus30MPlus29M59SBinNumbers
      - test:
          name: MetaData/aboutHourMinus30MPlus29M59STimestamps
        reference:
          name: TestReference/aboutHourMinus30MPlus29M59STimestamps
      # (C)
      - test:
          name: MetaData/excludingHourPlus1HourBinNumbers
        reference:
          name: TestReference/excludingHourPlus1HourBinNumbers
      - test:
          name: MetaData/excludingHourPlus1HourBinTimestamps
        reference:
          name: TestReference/excludingHourPlus1HourBinTimestamps
      # (D)
      - test:
          name: MetaData/aboutMidnightMinus12HBinNumbers
        reference:
          name: TestReference/aboutMidnightMinus12HBinNumbers
      - test:
          name: MetaData/aboutMidnightMinus12HTimestamps
        reference:
          name: TestReference/aboutMidnightMinus12HTimestamps
      # (E)
      - test:
          name: MetaData/aboutMinuteMinus30SPlus10SBinNumbers
        reference:
          name: TestReference/aboutMinuteMinus30SPlus10SBinNumbers
      - test:
          name: MetaData/aboutMinuteMinus30SPlus10STimestamps
        reference:
          name: TestReference/aboutMinuteMinus30SPlus10STimestamps
      # (F)
      - test:
          name: MetaData/reverseAboutHourMinus30MPlus29M59SBinNumbers
        reference:
          name: TestReference/reverseAboutHourMinus30MPlus29M59SBinNumbers
      - test:
          name: MetaData/reverseAboutHourMinus30MPlus29M59STimestamps
        reference:
          name: TestReference/aboutHourMinus30MPlus29M59STimestamps # should be the same as (B)
      # (G)
      - test:
          name: MetaData/reverseAboutHourMinus30MBinNumbers
        reference:
          name: TestReference/reverseAboutHourMinus30MBinNumbers
      - test:
          name: MetaData/reverseAboutHourMinus30MTimestamps
        reference:
          name: TestReference/aboutHourMinus30MTimestamps # should be the same as (A)
      # (H)
      - test:
          name: MetaData/reverseAboutHourPlus30MBinNumbers
        reference:
          name: TestReference/reverseAboutHourPlus30MBinNumbers
      - test:
          name: MetaData/reverseAboutHourPlus30MTimestamps
        reference:
          name: TestReference/reverseAboutHourPlus30MTimestamps # would be the same as non-reverse
